name: Manual pipeline config

# Trigger the pipeline on push
on:
  push:
    branches:
      - master
      - development

# Steps to execute
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.13.1"

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build
